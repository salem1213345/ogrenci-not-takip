name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Testler ve kapsam
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Kod kalitesi (flake8)
        run: python -m flake8 app tests main.py

      - name: Kod kalitesi (pylint)
        run: python -m pylint app main.py
